services:
  # 1. Spring Boot Backend Web Service (Optimized)
  - type: web
    name: vaahansetu-optimized-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /api/routes
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: "30000"

  # 2. Static Web Site (Passenger & Admin Portal - Optimized)
  - type: web
    name: vaahansetu-optimized-portal
    runtime: static
    rootDir: frontend
    buildCommand: echo "Deploying static assets"
    staticPublishPath: .
