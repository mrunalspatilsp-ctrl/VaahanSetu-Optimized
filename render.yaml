databases:
  - name: vaahansetu-db
    databaseName: vaahansetu
    user: vaahansetu
    region: singapore
    plan: free

services:
  # 1. Full-Stack Web Service (Spring Boot API + Embedded Passenger & Admin Portals)
  - type: web
    name: vaahansetu-optimized-app
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: DATABASE_URL
        fromDatabase:
          name: vaahansetu-db
          property: connectionString
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: "30000"

  # 2. Static Web Site (Passenger & Admin Portal CDN)
  - type: web
    name: vaahansetu-optimized-portal
    runtime: static
    rootDir: frontend
    buildCommand: echo "Deploying static assets"
    staticPublishPath: .
