services:
  # 1. Full-Stack Web Service (Spring Boot API + Embedded Passenger & Admin Portals)
  - type: web
    name: vaahansetu-optimized-app
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: DATABASE_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: "30000"

  # 2. Static Web Site (Passenger & Admin Portal CDN)
  - type: web
    name: vaahansetu-optimized-portal
    runtime: static
    rootDir: frontend
    buildCommand: echo "Deploying static assets"
    staticPublishPath: .
